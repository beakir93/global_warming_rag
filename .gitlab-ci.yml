image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"

cache:
  paths:
    - .cache/pip
    - .venv/

stages:
  - test
  - deploy

# Установка зависимостей (переиспользуется в других джобах)
.install_template: &install_deps
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

# Тестирование (опционально)
test:
  <<: *install_deps
  stage: test
  script:
    - echo "Running basic import tests..."
    - source .venv/bin/activate
    - python -c "from src.config import ROOT_DIR; print('Config OK')"
    - python -c "from src.llm import build_llm, build_embeddings; print('LLM imports OK')"
    - python -c "from src.retriever import HybridRetriever; print('Retriever OK')"
    - python -c "from src.rag import answer_query; print('RAG OK')"
  artifacts:
    reports:
      dotenv: .env.example

# Развёртывание приложения
deploy:
  <<: *install_deps
  stage: deploy
  script:
    - source .venv/bin/activate
    - |
      if [ ! -f data/index_meta.json ]; then
        echo "⚠️ Индекс не найден. Запускаем подготовку данных..."
        # Если нужны данные, раскомментируйте:
        # python prepare_data.py
        # Для демо используем готовые данные из репозитория
      fi
    - |
      # Создаём конфиг для Streamlit
      mkdir -p ~/.streamlit
      cat > ~/.streamlit/config.toml << EOF
      [server]
      headless = true
      port = $STREAMLIT_SERVER_PORT
      address = $STREAMLIT_SERVER_ADDRESS
      enableCORS = false
      enableXsrfProtection = true
      
      [browser]
      gatherUsageStats = false
      EOF
    - echo "🚀 Запуск Streamlit приложения..."
    - streamlit run app.py &
    - sleep 5
    - |
      # Проверка что приложение запустилось
      if curl -s http://localhost:$STREAMLIT_SERVER_PORT > /dev/null; then
        echo "✅ Приложение успешно запущено на порту $STREAMLIT_SERVER_PORT"
      else
        echo "❌ Не удалось подключиться к приложению"
        exit 1
      fi
  environment:
    name: production
    url: https://your-gitlab-instance.com/$CI_PROJECT_PATH
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
  allow_failure: false
  timeout: 10m

# Docker-развёртывание (альтернативный вариант)
docker_build:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:latest"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t $IMAGE_NAME -t $IMAGE_TAG .
    - docker push $IMAGE_NAME
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: []
